<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <rect width="700" height="260" fill="#FFFFFF"/>
  <text x="350" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#16213E">Your Best Guess, Plus a Margin of Error</text>
  <line x1="80" y1="140" x2="620" y2="140" stroke="#D3D8E4" stroke-width="1"/>
  <g>
    <line x1="260" y1="140" x2="440" y2="140" stroke="#B9822F" stroke-width="3"/>
    <line x1="260" y1="125" x2="260" y2="155" stroke="#B9822F" stroke-width="3"/>
    <line x1="440" y1="125" x2="440" y2="155" stroke="#B9822F" stroke-width="3"/>
    <circle cx="350" cy="140" r="7" fill="#16213E"/>
  </g>
  <text x="350" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#16213E">7.2</text>
  <text x="350" y="180" text-anchor="middle" font-size="11" fill="#4A5578">Best single estimate</text>
  <text x="260" y="205" text-anchor="middle" font-size="12" fill="#8F6421" font-weight="600">6.9</text>
  <text x="440" y="205" text-anchor="middle" font-size="12" fill="#8F6421" font-weight="600">7.5</text>
  <text x="350" y="230" text-anchor="middle" font-size="12" fill="#4A5578">95% confidence interval: the plausible range around your estimate</text>
</svg>
