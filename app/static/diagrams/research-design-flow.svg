<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <rect width="700" height="200" fill="#FFFFFF"/>
  <g font-size="11.5" fill="#16213E">
    <rect x="15" y="65" width="120" height="60" rx="4" fill="#EEF1F6" stroke="#D3D8E4"/>
    <text x="75" y="90" text-anchor="middle" font-weight="600">Research</text>
    <text x="75" y="105" text-anchor="middle" font-weight="600">Question</text>

    <rect x="155" y="65" width="120" height="60" rx="4" fill="#EEF1F6" stroke="#D3D8E4"/>
    <text x="215" y="90" text-anchor="middle" font-weight="600">Study</text>
    <text x="215" y="105" text-anchor="middle" font-weight="600">Design</text>

    <rect x="295" y="65" width="120" height="60" rx="4" fill="#EEF1F6" stroke="#D3D8E4"/>
    <text x="355" y="90" text-anchor="middle" font-weight="600">Sampling</text>
    <text x="355" y="105" text-anchor="middle" font-size="10" fill="#4A5578">Plan</text>

    <rect x="435" y="65" width="120" height="60" rx="4" fill="#EEF1F6" stroke="#D3D8E4"/>
    <text x="495" y="90" text-anchor="middle" font-weight="600">Ethics</text>
    <text x="495" y="105" text-anchor="middle" font-size="10" fill="#4A5578">Review</text>

    <rect x="575" y="65" width="110" height="60" rx="4" fill="#B9822F" opacity="0.15" stroke="#B9822F"/>
    <text x="630" y="90" text-anchor="middle" font-weight="600" fill="#8F6421">Data</text>
    <text x="630" y="105" text-anchor="middle" font-weight="600" fill="#8F6421">Collection</text>
  </g>
  <g stroke="#8F6421" stroke-width="1.5" marker-end="url(#rdarrow)">
    <line x1="135" y1="95" x2="153" y2="95"/>
    <line x1="275" y1="95" x2="293" y2="95"/>
    <line x1="415" y1="95" x2="433" y2="95"/>
    <line x1="555" y1="95" x2="573" y2="95"/>
  </g>
  <defs>
    <marker id="rdarrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8F6421"/>
    </marker>
  </defs>
  <text x="350" y="175" text-anchor="middle" font-size="12" fill="#4A5578">From Question to Data: The Research Design Sequence</text>
