<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <rect width="700" height="380" fill="#FFFFFF"/>
  <line x1="60" y1="300" x2="640" y2="300" stroke="#16213E" stroke-width="1.5"/>
  <path d="M 60 300 C 150 300 180 60 350 60 C 520 60 550 300 640 300" fill="none" stroke="#16213E" stroke-width="2.5"/>
  <path d="M 216 300 C 250 300 260 130 350 130 C 440 130 450 300 484 300 Z" fill="#B9822F" opacity="0.18"/>
  <path d="M 150 300 C 180 300 220 300 220 300 C 240 190 260 150 350 130 C 440 150 460 190 480 300 C 480 300 520 300 550 300 Z" fill="#B9822F" opacity="0.10"/>
  <line x1="350" y1="60" x2="350" y2="300" stroke="#4A5578" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="216" y1="300" x2="216" y2="240" stroke="#8F6421" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="484" y1="300" x2="484" y2="240" stroke="#8F6421" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="150" y1="300" x2="150" y2="255" stroke="#4A5578" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="550" y1="300" x2="550" y2="255" stroke="#4A5578" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="350" y="320" text-anchor="middle" font-size="13" fill="#16213E" font-weight="600">Mean</text>
  <text x="216" y="320" text-anchor="middle" font-size="12" fill="#8F6421">-1 SD</text>
  <text x="484" y="320" text-anchor="middle" font-size="12" fill="#8F6421">+1 SD</text>
  <text x="150" y="320" text-anchor="middle" font-size="11" fill="#4A5578">-2 SD</text>
