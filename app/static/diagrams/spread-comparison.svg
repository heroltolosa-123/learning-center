<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <rect width="700" height="320" fill="#FFFFFF"/>
  <text x="175" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#16213E">Class A: mean = 75, tightly clustered</text>
  <line x1="40" y1="230" x2="330" y2="230" stroke="#16213E" stroke-width="1.5"/>
  <path d="M 40 230 C 100 230 130 90 185 90 C 240 90 270 230 330 230" fill="none" stroke="#B9822F" stroke-width="2.5"/>
  <line x1="185" y1="90" x2="185" y2="230" stroke="#4A5578" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="185" y="248" text-anchor="middle" font-size="11" fill="#4A5578">75</text>
  <text x="60" y="248" text-anchor="middle" font-size="10" fill="#8495b0">65</text>
  <text x="310" y="248" text-anchor="middle" font-size="10" fill="#8495b0">85</text>

  <text x="525" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#16213E">Class B: mean = 75, widely spread</text>
  <line x1="390" y1="230" x2="680" y2="230" stroke="#16213E" stroke-width="1.5"/>
  <path d="M 390 230 C 430 230 470 150 535 150 C 600 150 640 230 680 230" fill="none" stroke="#8F6421" stroke-width="2.5"/>
  <line x1="535" y1="150" x2="535" y2="230" stroke="#4A5578" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="535" y="248" text-anchor="middle" font-size="11" fill="#4A5578">75</text>
  <text x="405" y="248" text-anchor="middle" font-size="10" fill="#8495b0">40</text>
  <text x="660" y="248" text-anchor="middle" font-size="10" fill="#8495b0">100</text>
  <text x="350" y="290" text-anchor="middle" font-size="12" fill="#4A5578">Same average score. Very different reality in the classroom.</text>
</svg>
