<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <rect width="700" height="400" fill="#FFFFFF"/>
  <g stroke="#D3D8E4" stroke-width="1.5">
    <line x1="350" y1="200" x2="200" y2="90"/>
