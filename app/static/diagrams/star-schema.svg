    <text x="350" y="205" text-anchor="middle" font-size="9.5" fill="#D3D8E4">Table</text>
    <text x="350" y="222" text-anchor="middle" font-size="9" fill="#D3D8E4">amount, quantity</text>

    <rect x="120" y="50" width="140" height="70" rx="4" fill="#EEF1F6" stroke="#16213E"/>
    <text x="190" y="80" text-anchor="middle" font-size="11.5" fill="#16213E" font-weight="600">Customer</text>
    <text x="190" y="96" text-anchor="middle" font-size="9.5" fill="#4A5578">Dimension</text>

    <rect x="440" y="50" width="140" height="70" rx="4" fill="#EEF1F6" stroke="#16213E"/>
