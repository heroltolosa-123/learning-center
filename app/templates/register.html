{% extends "base.html" %}
{% block title %}Register — {{ site_name }}{% endblock %}
{% block content %}
<div class="wrap">
  <div class="card narrow">
    <span class="eyebrow">New here</span>
    <h1 style="font-size:1.5rem;">Create your account</h1>
    <form method="post" action="/register">
      <div class="field">
        <label>Full name</label>
        <input type="text" name="name" required autofocus>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-gold btn-block">Create account</button>
    </form>
    <p style="margin-top:16px; font-size:0.88rem; color:var(--ink-soft);">
      Already registered? <a href="/login" style="color:var(--gold-deep);">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
