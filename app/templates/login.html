{% extends "base.html" %}
{% block title %}Log in — {{ site_name }}{% endblock %}
{% block content %}
<div class="wrap">
  <div class="card narrow">
    <span class="eyebrow">Access</span>
    <h1 style="font-size:1.5rem;">Log in</h1>
    <form method="post" action="/login">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-gold btn-block">Log in</button>
    </form>
    <p style="margin-top:16px; font-size:0.88rem; color:var(--ink-soft);">
      No account yet? <a href="/register" style="color:var(--gold-deep);">Register</a>
    </p>
  </div>
</div>
{% endblock %}
